{% set name = "vmd-python" %}
{% set version = "3.1.7" %}
{% set sha256 = "4b5525e7372e827655914cc716832739007c6ab82f1fc9c453f42a0814d9c9f1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  fn: {{ name }}-v{{ version }}.tar.gz
  url: https://github.com/Eigenstate/{{ name }}/archive/v{{ version }}.tar.gz
  sha256: {{ sha256 }}
  patches:
    # Fixes submitted upstream to Eigenstate/vmd-python; drop on next release
    - patches/0001-rnaview-give-process_3d_fig-a-full-prototype.patch
    - patches/0002-Fix-build-with-Python-3.13.patch
    - patches/0003-clustalw-give-fast_nj_tree-a-full-prototype.patch
    - patches/0004-stamp-use-full-prototypes-for-C23-GCC-15.patch
    - patches/0005-Keep-DeprecationWarnings-visible-on-Python-3.13.patch
    - patches/0006-stamp-convert-remaining-K-R-definitions-for-C23.patch

build:
  number: 1
  skip: true  # [win]
  script: {{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  build:
    - perl
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ stdlib("c") }}
    - make
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - setuptools
    - swig
    - numpy
  host:
    - python
    - pip
    - libnetcdf
    - expat
    - numpy
    - tk
    - setuptools
    - sqlite

  run:
    - python
    - libnetcdf
    - expat
    - {{ pin_compatible('numpy') }}
    - tk
    - sqlite

test:
  requires:
    - pytest
  commands:
    - py.test --pyargs vmd

about:
  home: http://github.com/Eigenstate/vmd-python
  license: VMD
  license_file: LICENSE
  summary: "Visual Molecular Dynamics (VMD) Python bindings"
  description: |
    vmd-python is Visual Molecular Dynamics (VMD) built as a Python extension
    module, with a few usability improvements. It includes functionality for
    loading and manipulating a variety of molecule file formats, working
    with trajectories, and many assorted plugins.
  doc_url: http://vmd.robinbetz.com
  dev_url: https://github.com/Eigenstate/vmd-python

extra:
  recipe-maintainers:
    - Eigenstate
